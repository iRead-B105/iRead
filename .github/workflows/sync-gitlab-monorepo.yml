name: GitLab Monorepo Sync

on:
  workflow_run:
    workflows:
      - Harness Validation
    types:
      - completed
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-monorepo-sync
  cancel-in-progress: false

jobs:
  sync:
    name: sync-gitlab-monorepo
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'develop'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout orchestration repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
          ref: >-
            ${{ github.event_name == 'workflow_run' &&
                github.event.workflow_run.head_sha || 'develop' }}

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validate harness for scheduled or manual sync
        if: github.event_name != 'workflow_run'
        run: python tools/validate_harness.py

      - name: Synchronize GitLab monorepo
        env:
          GITLAB_PUSH_TOKEN: ${{ secrets.GITLAB_PUSH_TOKEN }}
          SYNC_ORCHESTRATION_SHA: >-
            ${{ github.event_name == 'workflow_run' &&
                github.event.workflow_run.head_sha || '' }}
        run: bash tools/sync_gitlab_monorepo.sh
