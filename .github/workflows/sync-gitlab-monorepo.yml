name: GitLab Monorepo Sync

on:
  push:
    branches:
      - develop
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-monorepo-sync
  cancel-in-progress: false

jobs:
  sync:
    name: sync-gitlab-monorepo
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout orchestration repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Synchronize GitLab monorepo
        env:
          GITLAB_PUSH_TOKEN: ${{ secrets.GITLAB_PUSH_TOKEN }}
        run: bash tools/sync_gitlab_monorepo.sh
