name: Submodule Pointer Update

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: submodule-pointer-update
  cancel-in-progress: false

jobs:
  update:
    name: update-submodule-pointers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout orchestration develop
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          submodules: recursive
          ref: develop

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Update pointers to service develop
        id: update
        shell: bash
        run: |
          set -euo pipefail
          changes="$(python tools/update_submodule_pointers.py)"
          if [[ -z "$changes" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "changed=true"
            echo "changes<<EOF"
            echo "$changes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish pointer update branch
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/submodule-pointer-update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "iread-submodule-updater[bot]"
          git config user.email "iread-submodule-updater@users.noreply.github.com"

          git fetch origin \
            "$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$UPDATE_BRANCH" &&
             git diff --quiet "origin/$UPDATE_BRANCH" -- services; then
            echo "The existing pointer PR already contains these updates."
            exit 0
          fi

          git switch -C "$UPDATE_BRANCH"
          git add services
          git commit -m "chore(submodule): 서비스 develop 참조 자동 갱신"
          git push --force-with-lease origin "HEAD:$UPDATE_BRANCH"

          existing_pr="$(
            gh pr list \
              --base develop \
              --head "$UPDATE_BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number'
          )"
          if [[ -n "$existing_pr" ]]; then
            exit 0
          fi

          body_file="$(mktemp)"
          {
            echo "## 변경 내용"
            echo
            echo "각 서비스 저장소의 최신 \`develop\` 커밋으로 submodule 포인터를 갱신합니다."
            echo
            echo '```text'
            echo "${{ steps.update.outputs.changes }}"
            echo '```'
            echo
            echo "## 검증"
            echo
            echo "- 포인터 커밋의 원격 존재 여부 확인"
            echo "- 기존 포인터에서 fast-forward 이동인지 확인"
            echo "- 병합 후 Harness Validation 성공 시 GitLab main 자동 동기화"
            echo
            echo "## 승인"
            echo
            echo "- 필수 리뷰 인원: 0명"
            echo "- 변경된 서비스 조합을 확인한 뒤 바로 병합할 수 있습니다."
          } > "$body_file"

          gh pr create \
            --base develop \
            --head "$UPDATE_BRANCH" \
            --title "chore(submodule): 서비스 develop 참조 자동 갱신" \
            --body-file "$body_file"
