  "paths": {
    "/api/admin/realtime/events": {
      "get": {
        "operationId": "get_admin_realtime_events",
        "summary": "연결 학생 데이터 변경 이벤트 구독",
        "description": "교수자에게 연결된 학생의 데이터가 저장된 뒤 변경 이벤트를 SSE로 전달한다. 클라이언트는 이벤트 수신 후 관련 조회 API를 다시 호출하며, 저장 커밋부터 화면 반영까지 3초 이내를 목표로 한다.",
        "tags": [
          "realtime"
        ],
        "responses": {
          "200": {
            "description": "SSE 연결 성공",
            "content": {
              "text/event-stream": {
                "schema": {
                  "type": "string"
                },
                "example": "id: 36a09ada-0a57-41cf-9e8f-7bb2ce4aa98d\nevent: student-data-changed\ndata: {\"eventId\":\"36a09ada-0a57-41cf-9e8f-7bb2ce4aa98d\",\"studentId\":2001,\"resource\":\"TRAINING\",\"resourceId\":251136,\"changeType\":\"COMPLETED\",\"occurredAt\":\"2026-07-31T10:00:00+09:00\",\"version\":1785469200000}\n\n"
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          }
        },
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "x-contract-origin": "repository",
        "x-review-status": "reviewed"
      }
    },
