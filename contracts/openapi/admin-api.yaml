        "x-feature-ids": [
          "RP-GAZE-01"
        ],
        "description": "보고서의 아동과 기간에 속한 시선 분석 결과를 훈련·검사로 분리해 시간순 추이로 저장한다. 두 시점 이상이면 최초·최신 값의 정확한 차이와 INCREASED, DECREASED, UNCHANGED 방향을 descriptions에 저장하고, 한 시점이면 INSUFFICIENT_DATA를 표시한다. 이야기 결과는 제외하고 실패 세션은 건수만 포함한다. 기존 snapshotVersion과 calculationVersion 및 시선 외 snapshot 값은 보존한다.",
