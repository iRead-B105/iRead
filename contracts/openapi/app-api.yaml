    "/api/app/realtime/events": {
      "get": {
        "operationId": "get_app_realtime_events",
        "summary": "현재 학생 데이터 변경 이벤트 구독",
        "description": "현재 인증된 학생의 교수자 편집과 데이터 변경 이벤트를 SSE로 전달한다. 클라이언트는 별도 사용자 알림 없이 관련 조회 API를 다시 호출하며, 저장 커밋부터 화면 반영까지 3초 이내를 목표로 한다.",
        "tags": [
          "realtime"
        ],
        "responses": {
          "200": {
            "description": "SSE 연결 성공",
            "content": {
              "text/event-stream": {
                "schema": {
                  "type": "string"
                },
                "example": "id: 36a09ada-0a57-41cf-9e8f-7bb2ce4aa98d\nevent: student-data-changed\ndata: {\"eventId\":\"36a09ada-0a57-41cf-9e8f-7bb2ce4aa98d\",\"studentId\":2001,\"resource\":\"CURRICULUM\",\"resourceId\":190001,\"changeType\":\"UPDATED\",\"occurredAt\":\"2026-07-31T10:00:00+09:00\",\"version\":1785469200000}\n\n"
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          }
        },
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "x-contract-origin": "repository",
        "x-review-status": "reviewed"
      }
    },
