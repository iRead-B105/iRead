name: ${COMPOSE_PROJECT_NAME:-iread-demo}

services:
  mysql:
    image: mysql:8.4
    container_name: ${IREAD_CONTAINER_PREFIX:-iread}-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-iread_demo}
      MYSQL_USER: ${MYSQL_USER:-iread}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: ${TZ:-Asia/Seoul}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: ${IREAD_CONTAINER_PREFIX:-iread}-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 이름(ai-mock)은 backend AI_BASE_URL=iread-ai-mock:8080 호환을 위해 유지.
  # 내용은 services/ai 실제 FastAPI 서비스. 데모 프로필(ai.mock-*=true)에서는 backend가
  # AI를 호출하지 않아 유휴하며, AI_MOCK_* 토글 false 전환 시 본 서비스가 응답한다.
  ai:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    image: iread-ai:local
    container_name: ${IREAD_CONTAINER_PREFIX:-iread}-ai
    restart: unless-stopped
    ports:
      - "${AI_PORT:-8081}:8080"
    env_file:
      - path: ./services/ai/.env
        required: false
    environment:
      AI_INTERNAL_API_KEY: ${AI_API_KEY:-iread-local-ai-key}
      STORY_COVER_DIR: /app/story-covers
      CHAPTER_CANDIDATE_COUNT: "3"
      CHAPTER_QUALITY_RETRY_COUNT: "1"
      # 품질 계약(음절 범위·대화 형식) 미달 시 502 대신 최선 후보를 채택한다.
      # 계약 위반은 story_quality_gate 로그로 남는다. 모델이 음절 예산을
      # 안정적으로 지키게 되면 true로 되돌린다.
      CHAPTER_REQUIRE_CONTRACT_PASS: "false"
      AI_PRONUNCIATION_PROVIDER: ${AI_PRONUNCIATION_PROVIDER:-azure}
      AI_SPEECH_PROVIDER: ${AI_SPEECH_PROVIDER:-azure}
      AZURE_SPEECH_VOICE: ${AZURE_SPEECH_VOICE:-ko-KR-SunHiNeural}
    volumes:
      - ./services/frontend-app/src/assets/story/covers:/app/story-covers:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: ${IREAD_CONTAINER_PREFIX:-iread}-mailpit
    restart: unless-stopped
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"

  backend:
    image: eclipse-temurin:21-jdk
    container_name: ${IREAD_CONTAINER_PREFIX:-iread}-backend
    restart: unless-stopped
    working_dir: /workspace
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-iread_demo}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-iread}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      AI_BASE_URL: http://ai:8080
      AI_API_KEY: ${AI_API_KEY:-iread-local-ai-key}
      AI_READ_TIMEOUT: ${AI_READ_TIMEOUT:-210s}
      AI_MOCK_GENERATE: ${AI_MOCK_GENERATE:-true}
      AI_MOCK_STORY: ${AI_MOCK_STORY:-false}
      AI_MOCK_IMAGE: ${AI_MOCK_IMAGE:-false}
      AI_MOCK_EVALUATE: ${AI_MOCK_EVALUATE:-true}
      AI_MOCK_SPEECH: ${AI_MOCK_SPEECH:-true}
      AI_MOCK_PRONUNCIATION: ${AI_MOCK_PRONUNCIATION:-false}
      # 아이가 실제로 말한 내용을 받아써야 '말로 이야기 잇기'가 동작한다.
      # 목이면 항상 같은 문장으로 인식돼 기능이 무의미해진다.
      AI_MOCK_TRANSCRIBE: ${AI_MOCK_TRANSCRIBE:-false}
      # 목 TTS는 무음(10바이트)이라 소리 듣기가 전부 먹통이 된다.
      AI_MOCK_TTS: ${AI_MOCK_TTS:-false}
      TYPECAST_API_KEY: ${TYPECAST_API_KEY:-}
      IREAD_QA_DEMO_DATASET_ENABLED: ${IREAD_QA_DEMO_DATASET_ENABLED:-true}
      APP_FILE_STORAGE_LOCAL_UPLOAD_DIR: /data/uploads/images
      APP_AUDIO_STORAGE_LOCAL_UPLOAD_DIR: /data/audio
      APP_GAZE_STORAGE_LOCAL_UPLOAD_DIR: /data/gaze
      GRADLE_USER_HOME: /gradle-cache
    volumes:
      - ./services/backend:/workspace
      - gradle-cache:/gradle-cache
      - backend-images:/data/uploads/images
      - backend-audio:/data/audio
      - backend-gaze:/data/gaze
    command: ["sh", "./gradlew", "bootRun", "--no-daemon"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  frontend-web:
    image: node:24-bookworm-slim
    container_name: ${IREAD_CONTAINER_PREFIX:-iread}-frontend-web
    restart: unless-stopped
    working_dir: /workspace
    ports:
      - "${FRONTEND_WEB_PORT:-5173}:5173"
    environment:
      VITE_AUTH_SOURCE: api
      VITE_DATA_SOURCE: api
      VITE_API_BASE_URL: ""
      VITE_BACKEND_URL: http://backend:8080
    volumes:
      - ./services/frontend-web:/workspace
      - frontend-web-node-modules:/workspace/node_modules
      - pnpm-store:/pnpm-store
    command:
      - sh
      - -c
      - corepack enable && pnpm config set store-dir /pnpm-store && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0
    depends_on:
      - backend

  frontend-app:
    image: node:24-bookworm-slim
    container_name: ${IREAD_CONTAINER_PREFIX:-iread}-frontend-app
    restart: unless-stopped
    working_dir: /workspace
    ports:
      - "${FRONTEND_APP_PORT:-5174}:5174"
    environment:
      VITE_LEARNER_DATA_SOURCE: api
      VITE_API_BASE_URL: ""
      VITE_BACKEND_URL: http://backend:8080
      VITE_GAZE_WS_URL: ${VITE_GAZE_WS_URL:-ws://host.docker.internal:8765/gaze}
      VITE_GAZE_MODE_URL: ${VITE_GAZE_MODE_URL:-http://host.docker.internal:8765/api/mode}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./services/frontend-app:/workspace
      - frontend-app-node-modules:/workspace/node_modules
    command:
      - sh
      - -c
      - npm ci && npm run dev -- --host 0.0.0.0 --port 5174
    depends_on:
      - backend

networks:
  default:
    name: ${IREAD_NETWORK_NAME:-iread-network}

volumes:
  mysql-data:
    name: ${IREAD_VOLUME_PREFIX:-iread-demo}-mysql-data
  redis-data:
    name: ${IREAD_VOLUME_PREFIX:-iread-demo}-redis-data
  gradle-cache:
    name: ${IREAD_VOLUME_PREFIX:-iread-demo}-gradle-cache
  pnpm-store:
    name: ${IREAD_VOLUME_PREFIX:-iread-demo}-pnpm-store
  frontend-web-node-modules:
    name: ${IREAD_VOLUME_PREFIX:-iread-demo}-frontend-web-node-modules
  frontend-app-node-modules:
    name: ${IREAD_VOLUME_PREFIX:-iread-demo}-frontend-app-node-modules
  backend-images:
    name: ${IREAD_VOLUME_PREFIX:-iread-demo}-backend-images
  backend-audio:
    name: ${IREAD_VOLUME_PREFIX:-iread-demo}-backend-audio
  backend-gaze:
    name: ${IREAD_VOLUME_PREFIX:-iread-demo}-backend-gaze
